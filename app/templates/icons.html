{#- Line-art weather icons, viewBox 0 0 100 100, drawn in pure black for e-ink. -#}
{% macro cloud(dy=0, fill="none") -%}
<path transform="translate(0 {{ dy }})" fill="{{ fill }}"
      d="M28 70 H72 A15 15 0 0 0 72 40 A21 21 0 0 0 32 35 A17.5 17.5 0 0 0 28 70 Z"/>
{%- endmacro %}

{% macro icon(name, size=100) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 100 100" fill="none"
     stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "sunny" %}
  <circle cx="50" cy="50" r="18"/>
  {%- for a in range(0, 360, 45) %}
  <line x1="50" y1="14" x2="50" y2="22" transform="rotate({{ a }} 50 50)"/>
  {%- endfor %}
{%- elif name == "partly" %}
  <g transform="translate(-14 -14) scale(0.8)">
    <circle cx="50" cy="50" r="16"/>
    {%- for a in range(0, 360, 45) %}
    <line x1="50" y1="18" x2="50" y2="25" transform="rotate({{ a }} 50 50)"/>
    {%- endfor %}
  </g>
  <g transform="translate(8 10)">{{ cloud(0, "#fff") }}</g>
{%- elif name == "overcast" %}
  {{ cloud(4, "#bbb") }}
{%- elif name == "rain" %}
  {{ cloud(-12) }}
  <line x1="36" y1="70" x2="31" y2="84"/><line x1="52" y1="70" x2="47" y2="84"/><line x1="68" y1="70" x2="63" y2="84"/>
{%- elif name == "thunder" %}
  {{ cloud(-12) }}
  <polyline points="54,62 44,78 56,78 46,94"/>
{%- elif name == "snow" %}
  {{ cloud(-12) }}
  {%- for x in (34, 52, 70) %}
  <line x1="{{ x }}" y1="72" x2="{{ x }}" y2="86"/><line x1="{{ x - 6 }}" y1="79" x2="{{ x + 6 }}" y2="79"/>
  {%- endfor %}
{%- elif name == "sleet" %}
  {{ cloud(-12) }}
  <line x1="38" y1="70" x2="33" y2="84"/><circle cx="54" cy="78" r="3" fill="#000"/><line x1="70" y1="70" x2="65" y2="84"/>
{%- elif name == "fog" %}
  <line x1="18" y1="34" x2="82" y2="34"/><line x1="26" y1="50" x2="74" y2="50"/>
  <line x1="18" y1="66" x2="82" y2="66"/><line x1="30" y1="82" x2="70" y2="82"/>
{%- elif name in ("haze", "dust") %}
  <line x1="18" y1="40" x2="66" y2="40"/><line x1="30" y1="58" x2="82" y2="58"/><line x1="18" y1="76" x2="60" y2="76"/>
  <circle cx="80" cy="40" r="3" fill="#000"/><circle cx="20" cy="58" r="3" fill="#000"/><circle cx="74" cy="76" r="3" fill="#000"/>
{%- else %}
  <circle cx="50" cy="50" r="34"/>
  <path d="M38 40 A12 12 0 1 1 52 52 Q50 54 50 60"/><circle cx="50" cy="72" r="3" fill="#000"/>
{%- endif %}
</svg>
{%- endmacro %}
